<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LED KING - Professional LED lighting products and solutions in Fort Worth, Texas and across the United States.">
<title>LED KING | Professional LED Lighting</title>

<style>
/* =========================================================
   LED KING - BLACK + TEAL + LIME THEME
   ========================================================= */
:root{
    --blue:#00B8A9;
    --blue-dark:#009688;
    --blue-light:#E6FBF8;
    --gold-text:#008F83;
    --gold-text-hover:#006B63;
    --navy:#050505;
    --dark:#090909;
    --black:#000000;
    --white:#ffffff;
    --gray:#f5f7fa;
    --gray2:#eef2f6;
    --text:#1a2028;
    --muted:#697586;
    --border:#dfe5ec;
    --shadow:0 12px 35px rgba(0,0,0,.08);
    --shadow-hover:0 18px 45px rgba(0,0,0,.14);
    --radius:12px;
    --page-max:2400px;
    --page-pad:clamp(20px,2.4vw,56px);
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;line-height:1.6;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}
button,input,select,textarea{font:inherit;}

/* TOP BAR */
.top-bar{background:#26382E;color:#fff;min-height:46px;padding:7px 0;display:flex;align-items:center;border-bottom:1px solid rgba(197,166,106,.55);}
.top-bar-inner{max-width:var(--page-max);width:100%;margin:auto;padding:0 var(--page-pad);display:flex;justify-content:space-between;align-items:center;gap:24px;font-size:14px;font-weight:700;line-height:1.4;letter-spacing:.1px;}
.top-left,.top-right{display:flex;align-items:center;gap:26px;}
.top-item{display:flex;align-items:center;gap:9px;white-space:nowrap;}
.top-icon{font-size:17px;line-height:1;color:#E2C17E;display:inline-flex;align-items:center;justify-content:center;}

/* HEADER */
header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e4e8ed;}
.navbar{max-width:var(--page-max);height:82px;margin:auto;padding:0 var(--page-pad);display:flex;align-items:center;justify-content:space-between;}

/* LOGO */
.logo{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;letter-spacing:-1px;color:#111;}
.logo-symbol{width:52px;height:52px;border:3px solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-text);font-size:27px;font-weight:900;position:relative;}
.logo-symbol:after{content:"";position:absolute;width:11px;height:11px;background:var(--blue);border-radius:50%;right:-3px;bottom:1px;}
.logo span{color:var(--gold-text);}

/* NAVIGATION */
.nav-menu{display:flex;align-items:center;gap:30px;list-style:none;font-size:14px;font-weight:800;}
.nav-menu a{position:relative;padding:30px 0;transition:.2s;}
.nav-menu a:hover,.nav-menu a.active{color:var(--gold-text);}
.nav-menu a.active:after{content:"";position:absolute;height:3px;left:0;right:0;bottom:17px;background:var(--blue);}

/* NAV ACTIONS */
.nav-actions{display:flex;align-items:center;gap:19px;}
.nav-icon{font-size:22px;color:#101820;cursor:pointer;transition:.2s;}
.nav-icon:hover{color:var(--gold-text);}
.cart-icon{position:relative;}
.cart-number{position:absolute;top:-9px;right:-10px;background:var(--blue);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;}
.menu-btn{display:none;border:0;background:none;font-size:28px;cursor:pointer;}

/* HERO */
.hero{min-height:590px;position:relative;display:flex;align-items:center;overflow:hidden;
    background:
        linear-gradient(90deg,rgba(5,18,45,.90) 0%,rgba(8,38,91,.76) 38%,rgba(10,55,125,.42) 68%,rgba(10,55,125,.08) 100%),
        url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=90") center/cover no-repeat;}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--blue);}
.hero-content{max-width:var(--page-max);width:100%;margin:auto;padding:85px var(--page-pad);color:#fff;position:relative;z-index:2;}
.hero-text{max-width:720px;}
.hero-kicker{color:#C7F000;font-size:14px;font-weight:900;letter-spacing:2.5px;margin-bottom:15px;}
.hero-kicker:before{content:"";display:inline-block;width:38px;height:3px;background:#C7F000;margin-right:10px;vertical-align:middle;}
.hero h1{font-size:58px;line-height:1.05;font-weight:900;letter-spacing:-1.5px;margin-bottom:24px;}
.hero h1 span{color:#C7F000;display:block;}
.hero p{max-width:660px;color:#eeeeee;font-size:18px;line-height:1.65;margin-bottom:32px;}

/* BUTTONS */
.hero-buttons{display:flex;gap:13px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;padding:15px 25px;border-radius:7px;font-size:14px;font-weight:900;transition:.25s;}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 22px rgba(0,184,169,.30);}
.btn-blue:hover{background:var(--blue-dark);color:#fff;transform:translateY(-2px);}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.8);}
.btn-outline:hover{background:#fff;color:#111;transform:translateY(-2px);}

/* FEATURE STRIP */
.feature-strip{background:#fff;border-bottom:1px solid #e5e9ee;}
.feature-inner{max-width:var(--page-max);margin:auto;min-height:105px;padding:0 var(--page-pad);display:grid;grid-template-columns:repeat(4,1fr);}
.feature{display:flex;align-items:center;gap:17px;padding:20px 30px;border-right:1px solid #dfe4e9;}
.feature:first-child{padding-left:0;}
.feature:last-child{border-right:0;padding-right:0;}
.feature-icon{width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#111;}
.feature h3{font-size:14px;margin-bottom:2px;}
.feature p{color:var(--muted);font-size:12px;}

/* SECTION */
.section{padding:70px 0;}
.container{max-width:var(--page-max);margin:auto;padding:0 var(--page-pad);}

/* PRODUCT HEADER */
.products-heading{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:32px;}
.products-title .small{color:var(--gold-text);font-size:12px;font-weight:900;letter-spacing:1.7px;margin-bottom:4px;}
.products-title h2{color:#111;font-size:38px;line-height:1.1;margin-bottom:8px;}
.products-title p{color:var(--muted);max-width:650px;font-size:15px;}

/* PROMO BOX */
.promo-box{min-width:360px;min-height:115px;padding:22px 28px;border-radius:12px;
    background:
        linear-gradient(90deg,rgba(5,18,45,.88),rgba(10,55,125,.42)),
        url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=900&q=80") center/cover;
    color:#fff;display:flex;flex-direction:column;justify-content:center;}
.promo-label{display:inline-block;width:max-content;background:var(--blue);color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900;margin-bottom:5px;}
.promo-box strong{font-size:22px;}
.promo-box strong span{color:var(--blue);}

/* PRODUCTS */
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.product-card{display:grid;grid-template-columns:145px 1fr;min-height:145px;background:#fff;border:1px solid #e1e6eb;border-radius:10px;overflow:hidden;transition:.3s;box-shadow:0 4px 16px rgba(0,0,0,.035);}
.product-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);border-color:#00B8A9;}
.product-image{background:#f5f6f7;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;}
.product-image img{width:100%;height:100%;object-fit:contain;transition:.4s;}
.product-card:hover .product-image img{transform:scale(1.07);}
.product-info{padding:20px 18px;display:flex;flex-direction:column;justify-content:center;}
.product-info h3{font-size:16px;color:#111;margin-bottom:4px;}
.product-info p{color:#78818d;font-size:11px;line-height:1.5;margin-bottom:13px;}
.shop-link{color:var(--gold-text);font-size:11px;font-weight:900;}
.shop-link:hover{color:var(--gold-text-hover);}
.more-card{display:flex;align-items:center;justify-content:center;background:#123D79;border-color:#123D79;text-align:center;}
.more-inner{padding:22px 18px;}
.more-card h3{color:#fff;font-size:18px;margin-bottom:4px;}
.more-card p{color:#aeb8c4;font-size:12px;margin-bottom:14px;}
.more-card:hover{border-color:var(--blue);background:#0D7778;}

/* SPECIALTY */
.specialty-section{background:#f5f7f9;}
.section-heading-center{text-align:center;margin-bottom:40px;}
.section-heading-center .small{color:var(--gold-text);font-size:12px;font-weight:900;letter-spacing:2px;}
.section-heading-center h2{font-size:36px;color:#111;margin:6px 0 8px;}
.section-heading-center p{color:var(--muted);max-width:650px;margin:auto;}
.specialty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.specialty-item{background:#fff;border:1px solid #e1e6eb;border-radius:11px;padding:27px 20px;text-align:center;transition:.25s;}
.specialty-item:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
.specialty-icon{font-size:36px;margin-bottom:9px;}
.specialty-item h3{font-size:16px;}

/* WHY LED KING */
.why-section{background:linear-gradient(120deg,#050505 0%,#111111 72%,#073B37 100%);color:#fff;position:relative;overflow:hidden;}
.why-section:before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,90,31,.16);top:-200px;right:-100px;}
.why-section .section-heading-center .small{color:#C7F000;}
.why-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.why-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17);border-radius:11px;padding:28px 23px;}
.why-number{color:#C7F000;font-size:34px;font-weight:900;}
.why-card h3{font-size:17px;margin:6px 0 7px;}
.why-card p{color:#aeb8c4;font-size:13px;}

/* QUOTE */
.quote-section{background:#f5f7f9;}
.quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center;}
.quote-text h2{color:#111;font-size:42px;line-height:1.15;margin-bottom:15px;}
.quote-text h2 span{color:var(--gold-text);}
.quote-text p{color:#555;max-width:560px;}
.quote-points{list-style:none;margin-top:22px;}
.quote-points li{margin:10px 0;font-size:14px;}
.quote-points li:before{content:"✓";color:var(--gold-text);font-weight:900;margin-right:10px;}

/* FORM */
.form-box{background:#fff;border:1px solid #e0e5ea;border-radius:12px;padding:30px;box-shadow:var(--shadow);}
.form-box h3{font-size:24px;color:#111;margin-bottom:18px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid #dce1e6;border-radius:7px;outline:none;font-size:14px;background:#fff;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,184,169,.20);}
.form-group textarea{min-height:105px;resize:vertical;}

/* CONTACT */
.contact-section{background:#fff;}
.contact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.contact-card{border:1px solid #e0e5ea;border-radius:11px;padding:28px 18px;text-align:center;transition:.25s;}
.contact-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.contact-icon{font-size:30px;margin-bottom:8px;}
.contact-card h3{color:#111;margin-bottom:5px;}
.contact-card p{color:var(--muted);font-size:13px;}
.contact-card a{color:var(--gold-text);font-weight:700;}

/* FOOTER */
footer{background:#050c14;color:#fff;padding:55px 0 25px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:45px;}
.footer-logo{font-size:27px;font-weight:900;margin-bottom:12px;}
.footer-logo span{color:var(--blue);}
footer p{color:#9da8b5;font-size:13px;}
.footer-col h3{font-size:14px;margin-bottom:15px;color:var(--blue);}
.footer-col a{display:block;color:#9da8b5;margin:8px 0;font-size:13px;transition:.2s;}
.footer-col a:hover{color:#fff;}
.footer-bottom{margin-top:40px;padding-top:20px;border-top:1px solid #26323e;text-align:center;color:#687583;font-size:12px;}

/* ALIGNMENT + SIDE DECORATION */
:root{
    --grid:linear-gradient(rgba(18,61,121,.025) 1px,transparent 1px),
           linear-gradient(90deg,rgba(18,61,121,.025) 1px,transparent 1px);
}
#products,.contact-section{
    background:
        radial-gradient(circle at 0% 0%,rgba(255,90,31,.13),transparent 38%),
        radial-gradient(circle at 100% 100%,rgba(255,90,31,.10),transparent 38%),
        var(--grid),#fff;
    background-size:auto,auto,48px 48px,48px 48px;
}
.specialty-section,.quote-section{
    background:
        radial-gradient(circle at 100% 0%,rgba(255,90,31,.13),transparent 38%),
        radial-gradient(circle at 0% 100%,rgba(255,90,31,.10),transparent 38%),
        var(--grid),#f5f7f9;
    background-size:auto,auto,48px 48px,48px 48px;
}
.section-heading-center h2:after,.products-title h2:after,.quote-text h2:after{
    content:"";display:block;width:64px;height:4px;border-radius:2px;background:var(--blue);margin:14px auto 0;
}
.products-title h2:after,.quote-text h2:after{margin-left:0;}
.section-heading-center p{margin-top:14px;}
.products-title p{margin-top:14px;}
.quote-text p{margin-top:4px;}
.mobile-bar{display:none;}

/* RESPONSIVE */
@media(max-width:1150px){
    .nav-menu{gap:17px;}
    .product-grid{grid-template-columns:repeat(2,1fr);}
    .specialty-grid,.why-grid{grid-template-columns:repeat(2,1fr);}
    .hero h1{font-size:50px;}
}
@media(max-width:900px){
    .top-bar{display:flex;padding:9px 0;}
    .top-bar-inner{padding:0 20px;display:flex;flex-direction:column;align-items:stretch;gap:8px;font-size:13px;}
    .top-left,.top-right{width:100%;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .top-item{gap:7px;white-space:normal;}
    .top-icon{font-size:16px;}
    .navbar{height:70px;padding:0 20px;}
    .logo{font-size:22px;}
    .logo-symbol{width:42px;height:42px;font-size:21px;}
    .nav-menu{display:none;position:absolute;top:70px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;gap:0;padding:10px 20px 20px;border-bottom:1px solid #ddd;box-shadow:0 10px 20px rgba(0,0,0,.08);}
    .nav-menu.show{display:flex;}
    .nav-menu li{width:100%;}
    .nav-menu a{display:block;padding:14px 0;}
    .nav-menu a.active:after{bottom:7px;}
    .menu-btn{display:block;}
    .nav-actions{gap:12px;}
    .nav-icon.search-icon,.nav-icon.user-icon{display:none;}
    .hero{min-height:560px;}
    .hero-content{padding:70px 25px;}
    .hero h1{font-size:44px;}
    .feature-inner{grid-template-columns:repeat(2,1fr);}
    .feature:nth-child(2){border-right:0;padding-right:0;}
    .feature:nth-child(odd){padding-left:0;}
    .feature:nth-child(1),.feature:nth-child(2){border-bottom:1px solid #dfe4e9;}
    .products-heading{flex-direction:column;align-items:flex-start;}
    .promo-box{width:100%;min-width:0;}
    .quote-grid{grid-template-columns:1fr;}
    .contact-grid{grid-template-columns:repeat(2,1fr);}
    .footer-grid{grid-template-columns:1fr 1fr;}
    .mobile-bar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1100;background:#050c14;border-top:2px solid var(--blue);}
    .mobile-bar a{color:#fff;text-align:center;padding:9px 4px;font-size:10px;border-right:1px solid #27323d;}
    .mobile-bar span{display:block;font-size:17px;}
    footer{padding-bottom:75px;}
}
@media (min-width:1500px){
    .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;}
}
.container,.navbar,.hero-content,.top-bar-inner,.feature-inner{width:100%;}
.product-card{min-width:0;}
.product-info{min-width:0;overflow-wrap:anywhere;}
.product-info h3{font-size:15px;}
@media(max-width:1499px){
    .product-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:1150px){
    .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:600px){
    .product-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
    .container{padding:0 18px;}
    .hero-content{padding:60px 20px;}
    .hero{min-height:570px;background-position:center;}
    .hero h1{font-size:35px;letter-spacing:-.5px;}
    .hero p{font-size:15px;}
    .hero-buttons{flex-direction:column;align-items:stretch;}
    .hero-buttons .btn{width:100%;}
    .feature-inner{grid-template-columns:1fr;}
    .feature{border-right:0;border-bottom:1px solid #dfe4e9;padding:18px 0;}
    .feature:last-child{border-bottom:0;}
    .products-title h2{font-size:30px;}
    .product-grid{grid-template-columns:1fr;}
    .product-card{grid-template-columns:125px 1fr;}
    .section{padding:55px 0;}
    .section-heading-center h2{font-size:30px;}
    .specialty-grid,.why-grid,.contact-grid,.footer-grid{grid-template-columns:1fr;}
    .quote-text h2{font-size:32px;}
    .form-row{grid-template-columns:1fr;}
    .form-box{padding:22px;}
    .logo{font-size:19px;}
}
</style>
</head>
